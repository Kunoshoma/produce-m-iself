name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core unit tests
        run: ./gradlew :core:test --console=plain --no-daemon

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain --no-daemon

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --console=plain --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: produce-m-iself-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          retention-days: 7
